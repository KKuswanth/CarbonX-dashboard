<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CarbonX Marketplace</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="navbar"></div>

  <div class="container my-5">
    <h4 class="fw-bold mb-2"><i class="bi bi-shop"></i> Carbon Credit Marketplace</h4>
    <p class="text-muted mb-4">Buy and sell verified carbon credits from mangrove restoration projects</p>

    <div class="row g-3 mb-4">
      <div class="col-md-3">
        <div class="card stat-card">
          <div id="currentPrice" class="stat-value">₹24.50</div>
          <div class="stat-change"><i class="bi bi-cash-coin"></i> Current Price</div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card stat-card">
          <div id="volume24h" class="stat-value">0</div>
          <div class="stat-change"><i class="bi bi-bar-chart-line"></i> Trade Volume (credits)</div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card stat-card">
          <div id="availableCredits" class="stat-value">0</div>
          <div class="stat-change"><i class="bi bi-activity"></i> Available Credits</div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card stat-card">
          <div id="marketCap" class="stat-value">₹0</div>
          <div class="stat-change"><i class="bi bi-bank"></i> Trade Value</div>
        </div>
      </div>
    </div>

    <div class="card p-4 mb-4">
      <h6 class="fw-bold mb-3"><i class="bi bi-list-check"></i> Available Credits</h6>
      <table class="table">
        <thead>
          <tr>
            <th>Project</th>
            <th>Quantity</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="creditsTableBody">
          <tr><td colspan="4" class="text-muted">Loading…</td></tr>
        </tbody>
      </table>
    </div>

    <div class="card p-4">
      <h6 class="fw-bold mb-3"><i class="bi bi-lightning-charge"></i> Quick Trade</h6>
      <div class="d-flex gap-2 mb-4">
        <button class="btn btn-outline-success tab-btn active w-50" id="buyTab" type="button">
          <i class="bi bi-cart"></i> Buy
        </button>
        <button class="btn btn-outline-success tab-btn w-50" id="sellTab" type="button">
          <i class="bi bi-arrow-up-right-circle"></i> Sell
        </button>
      </div>

      <form id="marketForm" class="form-section">
        <div class="mb-3">
          <label class="form-label fw-bold">Project</label>
          <select class="form-select" id="projectName" required>
            <option value="">Select Project</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold">Quantity</label>
          <input type="number" class="form-control" id="credits" placeholder="Enter credits" min="1" required>
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold">Price per Credit (₹)</label>
          <input type="number" step="0.01" class="form-control" id="price" value="24.50" required>
        </div>
        <div class="mb-3">
          <p><strong>Total Amount:</strong> ₹<span id="totalAmount">0.00</span></p>
          <p><strong>Transaction Fee:</strong> ₹<span id="transactionFee">0.00</span></p>
        </div>
        <button type="submit" class="btn btn-success w-100 fs-5 py-2" id="submitBtn">
          <i class="bi bi-credit-card"></i> Place Buy Order
        </button>
        <div id="tradeMessage" class="alert mt-3 d-none"></div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script>
    loadNavbar();

    const buyTab = document.getElementById("buyTab");
    const sellTab = document.getElementById("sellTab");
    const submitBtn = document.getElementById("submitBtn");
    const creditsInput = document.getElementById("credits");
    const priceInput = document.getElementById("price");
    const totalAmount = document.getElementById("totalAmount");
    const transactionFee = document.getElementById("transactionFee");
    const currentPrice = document.getElementById("currentPrice");
    const volume24h = document.getElementById("volume24h");
    const marketCap = document.getElementById("marketCap");
    const availableCredits = document.getElementById("availableCredits");
    const projectSelect = document.getElementById("projectName");
    const tradeMessage = document.getElementById("tradeMessage");
    let mode = "BUY";

    buyTab.addEventListener("click", () => {
      mode = "BUY";
      buyTab.classList.add("active");
      sellTab.classList.remove("active");
      submitBtn.innerHTML = '<i class="bi bi-credit-card"></i> Place Buy Order';
      submitBtn.classList.remove("btn-danger");
      submitBtn.classList.add("btn-success");
    });

    sellTab.addEventListener("click", () => {
      mode = "SELL";
      sellTab.classList.add("active");
      buyTab.classList.remove("active");
      submitBtn.innerHTML = '<i class="bi bi-credit-card"></i> Place Sell Order';
      submitBtn.classList.remove("btn-success");
      submitBtn.classList.add("btn-danger");
    });

    function calculate() {
      const credits = parseFloat(creditsInput.value) || 0;
      const price = parseFloat(priceInput.value) || 0;
      const total = credits * price;
      totalAmount.textContent = total.toFixed(2);
      transactionFee.textContent = (total * 0.02).toFixed(2);
      if (price > 0) currentPrice.textContent = "₹" + price.toFixed(2);
    }

    creditsInput.addEventListener("input", calculate);
    priceInput.addEventListener("input", calculate);

    function renderProjects(projects) {
      const tbody = document.getElementById("creditsTableBody");
      const totalCredits = projects.reduce((sum, p) => sum + Number(p.credits || 0), 0);
      availableCredits.textContent = formatNumber(totalCredits);

      projectSelect.innerHTML = '<option value="">Select Project</option>' +
        projects.map((p) => `<option value="${p.name}">${p.name}</option>`).join("");

      tbody.innerHTML = projects.map((p) => `
        <tr>
          <td>${p.name}<br><small class="text-success"><i class="bi bi-patch-check-fill"></i> ${p.status}</small></td>
          <td>${formatNumber(p.credits)}</td>
          <td>${p.status}</td>
          <td>
            <button class="btn btn-success btn-sm buy-row-btn" data-project="${p.name}" type="button">
              <i class="bi bi-cart-check"></i> Buy
            </button>
          </td>
        </tr>
      `).join("");

      document.querySelectorAll(".buy-row-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          mode = "BUY";
          buyTab.click();
          projectSelect.value = btn.dataset.project;
          creditsInput.focus();
        });
      });
    }

    async function loadMarketStats() {
      const [projects, transactions] = await Promise.all([
        apiGet("/projects"),
        apiGet("/transactions"),
      ]);

      renderProjects(projects);

      const trades = (transactions || []).filter((tx) => tx.type === "BUY" || tx.type === "SELL");
      const volume = trades.reduce((sum, tx) => sum + Number(tx.credits || 0), 0);
      const value = trades.reduce((sum, tx) => sum + Number(tx.credits || 0) * Number(tx.price || 0), 0);
      volume24h.textContent = formatNumber(volume);
      marketCap.textContent = "₹" + formatNumber(Math.round(value));
    }

    document.getElementById("marketForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const project = projectSelect.value;
      const credits = Number(creditsInput.value);
      const price = Number(priceInput.value);

      try {
        const path = mode === "BUY" ? "/marketplace/buy" : "/marketplace/sell";
        const result = await apiPost(path, { project, credits, price });
        tradeMessage.className = "alert alert-success mt-3";
        tradeMessage.textContent = result.message || "Order placed.";
        tradeMessage.classList.remove("d-none");
        creditsInput.value = "";
        calculate();
        await loadMarketStats();
      } catch (err) {
        tradeMessage.className = "alert alert-danger mt-3";
        tradeMessage.textContent = err.message || "Order failed.";
        tradeMessage.classList.remove("d-none");
      }
    });

    loadMarketStats().catch(() => {
      document.getElementById("creditsTableBody").innerHTML =
        '<tr><td colspan="4" class="text-danger">Could not load marketplace data.</td></tr>';
    });
    calculate();
  </script>
</body>
</html>
