spring.application.name=carbonx-api
server.port=5000

# Default: H2 (works without installing MySQL). Switch to MySQL with: --spring.profiles.active=mysql
spring.datasource.url=jdbc:h2:file:./data/carbonx;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
