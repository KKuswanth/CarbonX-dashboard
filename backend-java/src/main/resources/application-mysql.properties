# Activate with: ./mvnw spring-boot:run -Dspring-boot.run.profiles=mysql
# First create DB: CREATE DATABASE carbonx;

spring.datasource.url=jdbc:mysql://localhost:3306/carbonx?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

spring.h2.console.enabled=false
